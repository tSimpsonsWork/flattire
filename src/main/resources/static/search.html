<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlatTire | Dependency Search</title>

    <link rel="stylesheet" href="/css/search.css?v=2">
</head>

<body>

<header class="site-header">

    <div class="header-content">

        <a href="/" class="brand">
            FlatTire
        </a>

        <nav class="topnav">

            <a href="/" class="nav-link">
                Project Scan
            </a>

            <a href="/search.html" class="nav-link active">
                Dependency Search
            </a>

        </nav>

    </div>

</header>


<main class="container">

    <section class="hero">

        <p class="eyebrow">
            MAVEN CENTRAL
        </p>

        <h1>
            Know your dependency before you ship it.
        </h1>

        <p>
            Search Maven Central and explore available versions
            before adding a dependency to your project.
        </p>


        <div class="search-container">

            <input
                    id="searchInput"
                    type="text"
                    placeholder="Search Maven dependencies..."
                    autocomplete="off">

            <button
                    id="searchButton"
                    type="button">
                Search
            </button>

        </div>


        <div
                id="status"
                class="status">
        </div>

    </section>


    <section
            id="searchSection"
            class="results-section hidden">

        <div class="section-header">

            <h2>
                Search Results
            </h2>

        </div>


        <div id="searchResults"></div>

    </section>


    <section
            id="versionSection"
            class="versions-section hidden">

        <div class="section-header">

            <div>

                <div class="section-label">
                    Dependency
                </div>

                <h2 id="selectedArtifact"></h2>

                <div
                        id="versionCount"
                        class="version-count">
                </div>

            </div>

        </div>


        <div
                id="versionResults"
                class="version-grid">
        </div>


        <button
                id="showAllButton"
                class="secondary-button hidden"
                type="button">
            Show all versions
        </button>

    </section>

</main>


<script src="/js/dependency-search.js"></script>

</body>

</html>
